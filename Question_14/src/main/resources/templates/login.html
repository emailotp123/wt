<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container mt-5" style="max-width:440px">
    <div class="card shadow-sm"><div class="card-body">
        <h4>Login to BookStore</h4>
        <div th:if="${param.error}" class="alert alert-danger">Invalid credentials.</div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <form th:action="@{/login}" method="post">
            <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" name="username" required></div>
            <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" name="password" required></div>
            <button class="btn btn-primary w-100">Login</button>
        </form>
        <p class="text-center mt-3 mb-0"><a th:href="@{/register}">New? Register</a> | <a th:href="@{/home}">← Home</a></p>
    </div></div>
</div>
</body>
</html>

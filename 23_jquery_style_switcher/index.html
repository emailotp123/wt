<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q23: jQuery Style Switcher</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; transition: all 0.3s; }
        .btn-bar { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; font-weight: bold; }
        #btn1 { background: #3498db; color: #fff; }
        #btn2 { background: #2ecc71; color: #fff; }
        #btn3 { background: #e74c3c; color: #fff; }
        .card { background: rgba(255,255,255,0.15); padding: 20px; border-radius: 8px; margin: 10px 0; }
        h2 { margin-top: 0; }
        input, select { padding: 8px; margin: 5px 0; display: block; width: 250px; border-radius: 4px; border: 1px solid #ccc; }
        label { font-weight: bold; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>jQuery Style Switcher</h2>
    <div class="btn-bar">
        <button id="btn1">Blue Theme</button>
        <button id="btn2">Green Theme</button>
        <button id="btn3">Red Theme</button>
    </div>
    <div class="card">
        <h3>Sample Form</h3>
        <label>Name</label><input type="text" placeholder="Enter name">
        <label>Course</label>
        <select><option>B.Tech</option><option>M.Tech</option><option>MBA</option></select>
        <label>Email</label><input type="email" placeholder="Enter email">
        <button style="margin-top:12px;padding:8px 20px;">Submit</button>
    </div>
    <div class="card">
        <h3>About VIT</h3>
        <p>Vishwakarma Institute of Technology is a premier technical institute located in Pune, Maharashtra.</p>
        <p>It offers undergraduate and postgraduate programs in engineering and management.</p>
    </div>
    <script>
        const themes = {
            blue:  { bg: '#1a2a4a', color: '#e8f0fe', cardBg: 'rgba(255,255,255,0.1)', inputBg: '#fff', inputColor: '#222' },
            green: { bg: '#1a3a2a', color: '#e8fdf0', cardBg: 'rgba(255,255,255,0.1)', inputBg: '#fff', inputColor: '#222' },
            red:   { bg: '#3a1a1a', color: '#fde8e8', cardBg: 'rgba(255,255,255,0.1)', inputBg: '#fff', inputColor: '#222' }
        };

        function applyTheme(t) {
            $('body').css({ background: t.bg, color: t.color });
            $('.card').css({ background: t.cardBg });
            $('input, select').css({ background: t.inputBg, color: t.inputColor });
        }

        $('#btn1').click(() => applyTheme(themes.blue));
        $('#btn2').click(() => applyTheme(themes.green));
        $('#btn3').click(() => applyTheme(themes.red));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q25: Traffic Signal</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2c3e50; display: flex; flex-direction: column; align-items: center; padding: 30px; color: #fff; }
        h2 { margin-bottom: 5px; }
        p { color: #aaa; margin-bottom: 20px; }
        .signal-box { background: #1a1a1a; border: 4px solid #555; border-radius: 15px; padding: 20px 30px; display: flex; flex-direction: column; align-items: center; gap: 18px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .led { width: 90px; height: 90px; border-radius: 50%; border: 4px solid #333; transition: box-shadow 0.3s; }
        .led.on-red    { background: #ff2200; box-shadow: 0 0 30px 12px rgba(255,34,0,0.8); }
        .led.on-yellow { background: #ffcc00; box-shadow: 0 0 30px 12px rgba(255,204,0,0.8); }
        .led.on-green  { background: #00cc44; box-shadow: 0 0 30px 12px rgba(0,204,68,0.8); }
        .led.off-red    { background: #440000; }
        .led.off-yellow { background: #443300; }
        .led.off-green  { background: #004411; }
        .status { margin-top: 20px; font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        .timer { font-size: 40px; font-weight: bold; margin: 5px 0; }
        .controls { margin-top: 20px; display: flex; gap: 15px; }
        button { padding: 10px 24px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; background: #007bff; color: #fff; }
        button:hover { background: #0056b3; }
        .pole { width: 14px; height: 80px; background: #555; border-radius: 3px; }
        .base { width: 120px; height: 20px; background: #555; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Traffic Signal</h2>
    <p>Responsive animated traffic signal with glowing LEDs</p>
    <div class="signal-box">
        <div class="led off-red"    id="red"></div>
        <div class="led off-yellow" id="yellow"></div>
        <div class="led off-green"  id="green"></div>
    </div>
    <div class="pole"></div>
    <div class="base"></div>
    <div class="status" id="statusText">RED &mdash; STOP</div>
    <div class="timer" id="timerText">10</div>
    <div class="controls">
        <button id="toggleBtn" onclick="toggleSignal()">Pause</button>
    </div>
    <script>
        const signals = [
            { id: 'red',    cls: 'on-red',    off: 'off-red',    text: 'RED — STOP',   duration: 10 },
            { id: 'yellow', cls: 'on-yellow', off: 'off-yellow', text: 'YELLOW — READY', duration: 3 },
            { id: 'green',  cls: 'on-green',  off: 'off-green',  text: 'GREEN — GO',   duration: 8 }
        ];
        let current = 0, timeLeft = signals[0].duration, running = true, interval;

        function updateLEDs() {
            signals.forEach((s, i) => {
                const el = document.getElementById(s.id);
                el.className = 'led ' + (i === current ? s.cls : s.off);
            });
            document.getElementById('statusText').textContent = signals[current].text;
        }

        function tick() {
            document.getElementById('timerText').textContent = timeLeft;
            if (timeLeft === 0) {
                current = (current + 1) % signals.length;
                timeLeft = signals[current].duration;
                updateLEDs();
            } else { timeLeft--; }
        }

        function toggleSignal() {
            running = !running;
            document.getElementById('toggleBtn').textContent = running ? 'Pause' : 'Resume';
            if (running) interval = setInterval(tick, 1000);
            else clearInterval(interval);
        }

        updateLEDs();
        interval = setInterval(tick, 1000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Catalog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark px-4 d-flex justify-content-between">
    <a th:href="@{/}" class="navbar-brand fw-bold">📚 VIT BookStore</a>
    <a th:href="@{/home}" class="btn btn-outline-light btn-sm">Home</a>
</nav>
<div class="container mt-4">
    <h3>Book Catalog</h3>
    <form th:action="@{/catalog}" method="get" class="d-flex gap-2 mb-4 flex-wrap">
        <input class="form-control w-auto" name="search" placeholder="Search by title..." th:value="${search}">
        <select class="form-select w-auto" name="category">
            <option value="">All Categories</option>
            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option>
        </select>
        <button class="btn btn-primary">Filter</button>
        <a th:href="@{/catalog}" class="btn btn-outline-secondary">Reset</a>
    </form>
    <div class="row g-3">
        <div class="col-md-4 col-sm-6" th:each="book : ${books}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <span class="badge bg-info mb-2" th:text="${book.category}"></span>
                    <h6 class="card-title" th:text="${book.title}"></h6>
                    <p class="text-muted small" th:text="${book.author}"></p>
                    <p class="card-text small" th:text="${book.description}"></p>
                </div>
                <div class="card-footer bg-transparent">
                    <strong class="text-success" th:text="'₹' + ${book.price}"></strong>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(books)}" class="alert alert-info mt-3">No books found.</div>
</div>
</body>
</html>

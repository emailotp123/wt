<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container mt-5" style="max-width:440px">
    <div class="card shadow-sm"><div class="card-body">
        <h4>Create Account</h4>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="mb-3"><label class="form-label">Name</label><input class="form-control" th:field="*{name}" required></div>
            <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" th:field="*{email}" required></div>
            <div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" th:field="*{password}" required></div>
            <button class="btn btn-success w-100">Register</button>
        </form>
        <p class="text-center mt-3 mb-0"><a th:href="@{/login}">Already registered? Login</a></p>
    </div></div>
</div>
</body>
</html>

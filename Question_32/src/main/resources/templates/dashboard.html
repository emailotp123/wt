<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<div class="container mt-4" style="max-width:700px">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Welcome, <span th:text="${user?.name}">User</span>!</h4>
        <form th:action="@{/logout}" method="post">
            <button class="btn btn-danger btn-sm">Logout</button>
        </form>
    </div>
    <div class="card mb-4 shadow-sm"><div class="card-body">
        <h6>Your Account</h6>
        <p class="mb-1"><strong>Email:</strong> <span th:text="${user?.email}"></span></p>
        <p class="mb-1"><strong>BCrypt Hashed Password:</strong></p>
        <code class="small" th:text="${hashedPassword}" style="word-break:break-all;color:#e74c3c"></code>
        <p class="text-muted small mt-2">Password is securely stored using BCrypt encryption (strength 10).</p>
    </div></div>
    <div class="card shadow-sm"><div class="card-body p-0">
        <div class="p-3"><strong>All Registered Users</strong></div>
        <table class="table table-striped mb-0">
            <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Password (BCrypt)</th></tr></thead>
            <tbody>
                <tr th:each="u : ${allUsers}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.name}"></td>
                    <td th:text="${u.email}"></td>
                    <td class="small text-muted" th:text="${#strings.substring(u.password, 0, 30)}+'...'"></td>
                </tr>
            </tbody>
        </table>
    </div></div>
</div>
</body>
</html>

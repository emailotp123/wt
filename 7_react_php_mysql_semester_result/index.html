<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q7: VIT Student Result</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        h2 { color: #333; text-align: center; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin: 8px 0 4px; color: #555; font-size: 13px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th { background: #007bff; color: #fff; padding: 8px 10px; text-align: left; }
        td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        tr:hover td { background: #f8f9fa; }
        .pass { color: #28a745; font-weight: bold; }
        .fail { color: #dc3545; font-weight: bold; }
        .result-row { font-weight: bold; background: #f8f9fa; }
        .overall { padding: 12px 16px; border-radius: 6px; font-size: 18px; font-weight: bold; text-align: center; margin-top: 12px; }
        .overall.pass { background: #d4edda; color: #155724; }
        .overall.fail { background: #f8d7da; color: #721c24; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; color: #fff; }
        .badge.pass { background: #28a745; }
        .badge.fail { background: #dc3545; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const SUBJECTS = ['Mathematics', 'Physics', 'Programming', 'Engineering Drawing'];
        const MSE_MAX = 30, ESE_MAX = 70, PASS_MIN = 40;

        // Child: Student info display
        function Student({ name, course, marks }) {
            return (
                <div className="card">
                    <h3 style={{marginTop:0}}>Student Information</h3>
                    <p><strong>Name:</strong> {name}</p>
                    <p style={{margin:'4px 0'}}><strong>Course:</strong> {course}</p>
                    <p style={{margin:'4px 0'}}><strong>Subjects:</strong> {SUBJECTS.join(', ')}</p>
                </div>
            );
        }

        // Child: Result display
        function Result({ marks }) {
            const rows = SUBJECTS.map((sub, i) => {
                const mse = marks[i]?.mse ?? 0;
                const ese = marks[i]?.ese ?? 0;
                const total = Math.round(mse + ese);
                const pass = total >= PASS_MIN;
                return { sub, mse, ese, total, pass };
            });
            const totalScore = rows.reduce((s, r) => s + r.total, 0);
            const percentage = ((totalScore / (SUBJECTS.length * 100)) * 100).toFixed(1);
            const overallPass = rows.every(r => r.pass);

            return (
                <div className="card">
                    <h3 style={{marginTop:0}}>Result Card</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Subject</th>
                                <th>MSE (30%)</th>
                                <th>ESE (70%)</th>
                                <th>Total (100)</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            {rows.map(r => (
                                <tr key={r.sub}>
                                    <td>{r.sub}</td>
                                    <td>{r.mse.toFixed(1)}</td>
                                    <td>{r.ese.toFixed(1)}</td>
                                    <td><strong>{r.total}</strong></td>
                                    <td><span className={`badge ${r.pass?'pass':'fail'}`}>{r.pass?'PASS':'FAIL'}</span></td>
                                </tr>
                            ))}
                            <tr className="result-row">
                                <td colSpan={3}><strong>Total / Percentage</strong></td>
                                <td><strong>{totalScore}/{SUBJECTS.length*100}</strong></td>
                                <td>{percentage}%</td>
                            </tr>
                        </tbody>
                    </table>
                    <div className={`overall ${overallPass?'pass':'fail'}`}>
                        Overall Result: {overallPass ? '✅ PASS' : '❌ FAIL'}
                    </div>
                </div>
            );
        }

        // Parent: App
        function App() {
            const [name, setName] = React.useState('Vedant Mahalle');
            const [course, setCourse] = React.useState('B.Tech - Computer Engineering');
            const [marks, setMarks] = React.useState(
                SUBJECTS.map(() => ({ mse: 0, ese: 0 }))
            );

            const updateMark = (i, field, val) => {
                const max = field === 'mse' ? MSE_MAX : ESE_MAX;
                const v = Math.min(max, Math.max(0, parseFloat(val) || 0));
                setMarks(prev => prev.map((m, j) => j === i ? { ...m, [field]: v } : m));
            };

            return (
                <div className="container">
                    <h2>VIT Student Result System</h2>
                    <div className="card">
                        <h3 style={{marginTop:0}}>Enter Details</h3>
                        <label>Student Name</label>
                        <input value={name} onChange={e => setName(e.target.value)} />
                        <label>Course</label>
                        <input value={course} onChange={e => setCourse(e.target.value)} />
                        <h4 style={{margin:'16px 0 8px'}}>Enter Marks</h4>
                        <table>
                            <thead>
                                <tr>
                                    <th>Subject</th>
                                    <th>MSE (max {MSE_MAX})</th>
                                    <th>ESE (max {ESE_MAX})</th>
                                </tr>
                            </thead>
                            <tbody>
                                {SUBJECTS.map((sub, i) => (
                                    <tr key={sub}>
                                        <td>{sub}</td>
                                        <td>
                                            <input type="number" min="0" max={MSE_MAX}
                                                value={marks[i].mse}
                                                onChange={e => updateMark(i, 'mse', e.target.value)} />
                                        </td>
                                        <td>
                                            <input type="number" min="0" max={ESE_MAX}
                                                value={marks[i].ese}
                                                onChange={e => updateMark(i, 'ese', e.target.value)} />
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <Student name={name} course={course} marks={marks} />
                    <Result marks={marks} />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

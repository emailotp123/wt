<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q22: Canvas Drawing</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        h2 { color: #333; }
        .controls { margin: 10px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        button { padding: 8px 18px; border: none; border-radius: 4px; cursor: pointer; background: #ddd; font-size: 14px; }
        button.active { background: #007bff; color: #fff; }
        #colorPicker { height: 35px; width: 50px; border: none; cursor: pointer; }
        canvas { border: 2px solid #999; background: #fff; cursor: crosshair; display: block; margin-top: 10px; }
        #info { color: #555; font-size: 13px; }
    </style>
</head>
<body>
    <h2>Canvas Drawing Tool</h2>
    <div class="controls">
        <button id="lineBtn" class="active" onclick="setMode('line')">Line</button>
        <button id="rectBtn" onclick="setMode('rect')">Rectangle</button>
        <input type="color" id="colorPicker" value="#000000" title="Pick color">
        <button onclick="clearCanvas()" style="background:#e74c3c;color:#fff;">Clear</button>
        <span id="info">Mode: Line &mdash; Click and drag to draw</span>
    </div>
    <canvas id="canvas" width="850" height="500"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let mode = 'line', isDrawing = false, startX, startY, snapshot;

        function setMode(m) {
            mode = m;
            document.getElementById('lineBtn').className = m === 'line' ? 'active' : '';
            document.getElementById('rectBtn').className = m === 'rect' ? 'active' : '';
            document.getElementById('info').textContent = `Mode: ${m.charAt(0).toUpperCase() + m.slice(1)} — Click and drag to draw`;
        }

        canvas.addEventListener('mousedown', e => {
            isDrawing = true;
            startX = e.offsetX; startY = e.offsetY;
            snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        });

        canvas.addEventListener('mousemove', e => {
            if (!isDrawing) return;
            ctx.putImageData(snapshot, 0, 0);
            ctx.strokeStyle = document.getElementById('colorPicker').value;
            ctx.lineWidth = 2;
            ctx.beginPath();
            if (mode === 'line') {
                ctx.moveTo(startX, startY);
                ctx.lineTo(e.offsetX, e.offsetY);
            } else {
                ctx.rect(startX, startY, e.offsetX - startX, e.offsetY - startY);
            }
            ctx.stroke();
        });

        canvas.addEventListener('mouseup', () => { isDrawing = false; });
        canvas.addEventListener('mouseleave', () => { isDrawing = false; });

        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    </script>
</body>
</html>
